<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — MobileHub</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#f5f5fb;color:#14141f;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px}
  .box{max-width:360px}
  .icon{font-size:56px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#6b7280;font-size:14px}
  button{margin-top:16px;background:#4338ca;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>MobileHub needs an internet connection to load new data. Previously viewed pages may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
